# New workflow file on purpose: GitHub disabled the previous one
# (ping-supabase.yml) for inactivity, and a disabled workflow stays off
# until someone clicks Enable. A new path is created enabled on merge.
name: Keep Supabase Awake

on:
  schedule:
    # Twice daily — well inside Supabase's ~7 day free-plan pause window
    - cron: "0 9 * * *"
    - cron: "0 21 * * *"
  # Merging this file (or any later main push) pings immediately
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Error: SUPABASE_URL secret is not set. Please add it in Settings > Secrets and variables > Actions" >&2
            exit 1
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Error: SUPABASE_SERVICE_ROLE_KEY secret is not set. Please add it in Settings > Secrets and variables > Actions" >&2
            exit 1
          fi

          response=$(curl -sS --fail-with-body \
            -X GET "${SUPABASE_URL}/rest/v1/matches?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json")

          if [ -z "$response" ]; then
            echo "Error: empty response when pinging Supabase. Check your SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY." >&2
            exit 1
          fi

          echo "Successful ping: $response"

  # GitHub turns off scheduled workflows on public repos after 60 days
  # with no pushes/PRs. Re-enabling via the API resets that timer without
  # dummy commits. This only runs on the cron so ordinary pushes stay quiet.
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
